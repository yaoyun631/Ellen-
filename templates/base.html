<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Ellen帶你找家{% endblock %}</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        /* 🎨 顏色設定 */
        :root {
            --nc-navbar:  #F3E6D4;   /* 淺奶茶色（上欄） */
            --nc-footer:  #F3E6D4;   /* 淺奶茶色（下欄） */
            --nc-content: #ffffff;   /* 中間白色內容區 */
            --nc-text:    #4A3F35;   /* 深咖文字 */
            --nc-accent:  #D2A784;   /* 奶茶強調色 */
        }

        body {
            background-color: var(--nc-content) !important;
            color: var(--nc-text);
            font-family: "Noto Sans TC", sans-serif;
        }

        /* ⭐ NAVBAR */
        .navbar-ellen {
            background-color: var(--nc-navbar) !important;
            border-bottom: 1px solid #e0d6c8;
        }
        .navbar-brand,
        .navbar-ellen .nav-link {
            color: var(--nc-text) !important;
            font-weight: 500;
        }
        /* active：底線（不加粗） */
        .navbar-ellen .nav-link.active {
            border-bottom: 2px solid var(--nc-accent);
            color: var(--nc-text) !important;
            font-weight: 500 !important;
        }

        /* ⭐ LOGO */
        .navbar-brand img {
            max-height: 80px;
            background: none !important;  /* 保留透明 PNG */
            box-shadow: none;
        }

        /* ⭐ Footer */
        footer {
            background: var(--nc-footer) !important;
            color: var(--nc-text) !important;
            border-top: 1px solid #e0d6c8;
        }
        footer a {
            color: var(--nc-accent);
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<!-- ⭐ NAVBAR：上方有奶茶色 -->
<nav class="navbar navbar-expand-lg navbar-light navbar-ellen mb-4">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='images/logo/logo.png') }}" alt="Logo" class="me-2">
            <span class="fw-bold">Ellen帶你找家</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('index') }}">找好房</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/rent' %}active{% endif %}" href="{{ url_for('rent') }}">租好屋</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.path.startswith('/blog') %}active{% endif %}" href="{{ url_for('blog.index') }}">房產知識</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/loan' %}active{% endif %}" href="{{ url_for('loan') }}">試算工具</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/videos' %}active{% endif %}" href="{{ url_for('videos') }}">看屋影片</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/contact' %}active{% endif %}" href="{{ url_for('contact') }}">預約看房/諮詢</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- ⭐ 中間內容區：保持白色 -->
<div class="container">
    {% block content %}{% endblock %}
</div>

<!-- ⭐ Footer：下方也有奶茶色 -->
<footer class="mt-5 pt-4 pb-3">
    <div class="container">
        <div class="row text-center text-md-start align-items-center">
            <div class="col-md-6 mb-3 d-flex align-items-center">
                <img src="{{ url_for('static', filename='images/logo/logo.png') }}" alt="Logo" style="height: 80px;" class="me-3">
                <div>
                    <p class="mb-1">電話：0909-663-034　LINE：
                      <a href="https://line.me/ti/p/pAmRLPN2Ip" target="_blank">點我加入 LINE</a></p>
                    <p class="mb-1">E-mail：
                      <a href="mailto:e.llen3212383@gmail.com">e.llen3212383@gmail.com</a></p>

                    <p class="mb-1">
                      地址：
                      <a href="https://maps.app.goo.gl/VdjR6W5iNV7SatWz5" target="_blank">
                        台中市沙鹿區鎮南路二段123號（查看地圖）
                      </a>
                    </p>
                </div>
            </div>
        </div>

        <hr class="border-dark">
        <p class="text-center small mb-0">© Ellen帶你找家 All Rights Reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
