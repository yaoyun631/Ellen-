<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>愛屋 Selenium 抓取工具</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: "微軟正黑體", sans-serif;
      background-color: #f8f8f8;
      padding: 30px;
    }
    .container-box {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    textarea {
      font-family: "Consolas", "Courier New", monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
<div class="container-box">

  <h3 class="mb-3">愛屋 Selenium 抓取工具</h3>

  <p class="text-muted">
    這個頁面會在 <strong>後端</strong> 用 Selenium 幫你做以下流程：<br>
    1. 自動登入愛屋（H229 / sp290 / 0000）<br>
    2. 進入出售列表頁，一直點「查看更多」，把所有「型錄」網址抓下來<br>
    3. 把網址存成 <code>data/愛屋YYYYMMDD.txt</code><br>
    4. 讀剛剛的 TXT，逐一抓詳細資料，存成 Firestore 的 JSON / chunk
  </p>

  <form method="post">
    <button type="submit" class="btn btn-primary">
      🚀 開始執行 Selenium 抓取 + 產生 JSON
    </button>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary ms-2">回後台主頁</a>
  </form>

  {% if log_text %}
    <hr>
    <h5>執行紀錄：</h5>
    <textarea class="form-control" rows="15" readonly>{{ log_text }}</textarea>
  {% endif %}

</div>
</body>
</html>
