<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>後台物件查詢</title>
  <style>
    body {
      font-family: "微軟正黑體", sans-serif;
      font-size: 18px;
      background-color: #f8f8f8;
      padding: 50px;
      max-width: 800px;
      margin: auto;
      line-height: 1.8;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 30px;
      text-align: center;
    }

    form {
      margin-bottom: 30px;
      text-align: center;
    }

    label {
      font-size: 20px;
      margin-right: 10px;
    }

    input[type="text"] {
      font-size: 18px;
      padding: 8px 12px;
      width: 300px;
    }

    button {
      font-size: 18px;
      padding: 8px 16px;
      background-color: #CABAA1;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #b8a788;
    }

    ul {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      list-style: none;
    }

    li {
      margin-bottom: 10px;
    }

    strong {
      color: #555;
    }

    p {
      text-align: center;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>🔍 後台物件編號查詢</h1>

  <form method="post">
    <label for="house_id">請輸入物件編號：</label>
    <input type="text" id="house_id" name="house_id" required>
    <button type="submit">查詢</button>
  </form>

  {% if error %}
    <p style="color:red;">{{ error }}</p>
  {% endif %}

  {% if result %}
    <h2>查詢結果：</h2>
    <ul>
      <li><strong>完整地址：</strong>{{ result['地址'] }}</li>
      <li><strong>備註：</strong>{{ result['備註'] }}</li>
      <li><strong>帶看方式：</strong>{{ result['帶看方式'] }}</li>
      <li><strong>租金：</strong>{{ result['租金'] }}</li>
      <li><strong>格局：</strong>{{ result['格局'] }}</li>
      <li><strong>房屋類型：</strong>{{ result['房屋類型'] }}</li>
    </ul>
  {% endif %}
</body>
</html>
