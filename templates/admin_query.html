<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>後台物件查詢</title>
</head>
<body>
  <h1>物件編號查詢</h1>
  <form method="post">
    <label for="house_id">請輸入物件編號：</label>
    <input type="text" id="house_id" name="house_id" required>
    <button type="submit">查詢</button>
  </form>

  {% if error %}
    <p style="color:red;">{{ error }}</p>
  {% endif %}

  {% if result %}
    <h2>查詢結果：</h2>
    <ul>
      <li><strong>完整地址：</strong>{{ result['地址'] }}</li>
      <li><strong>備註：</strong>{{ result['備註'] }}</li>
      <li><strong>帶看方式：</strong>{{ result['帶看方式'] }}</li>
      <li><strong>租金：</strong>{{ result['租金'] }}</li>
      <li><strong>格局：</strong>{{ result['格局'] }}</li>
      <li><strong>房屋類型：</strong>{{ result['房屋類型'] }}</li>
      <!-- 你可以依需求繼續加更多欄位 -->
    </ul>
  {% endif %}
</body>
</html>
