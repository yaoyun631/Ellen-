<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>互動地圖找房 - 篩選版</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #filters {
      padding: 10px;
      background: #f9f9f9;
      border-bottom: 1px solid #ccc;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      position: relative;
      z-index: 1000;
    }
    label {
      font-weight: bold;
      margin-right: 6px;
    }
    select, input[type="number"] {
      padding: 4px 6px;
      font-size: 14px;
    }
    button {
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    #map {
      position: absolute;
      top: 58px;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(100% - 58px);
      width: 100%;
      z-index: 0;
    }
    .leaflet-popup-content-wrapper {
      font-size: 16px !important;
      max-width: 280px !important;
    }
    .leaflet-popup-content {
      margin: 8px 12px !important;
    }
    #countDisplay {
      position: absolute;
      top: 58px;
      left: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 16px;
      z-index: 1100;
      pointer-events: none;
      user-select: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>

<div id="filters">
  <div>
    <label for="areaSelect">區域:</label>
    <select id="areaSelect"><option value="">全部</option></select>
  </div>
  <div>
    <label for="typeSelect">房型:</label>
    <select id="typeSelect"><option value="">全部</option></select>
  </div>
  <div>
    <label for="layoutSelect">格局:</label>
    <select id="layoutSelect"><option value="">全部</option></select>
  </div>
  <div>
    <label for="ageSelect">屋齡:</label>
    <select id="ageSelect">
      <option value="">不限</option>
      <option value="5">5年以內</option>
      <option value="10">10年以內</option>
      <option value="20">20年以內</option>
    </select>
  </div>
  <div>
    <label for="minPrice">最低總價 (萬):</label>
    <input type="number" id="minPrice" min="0" placeholder="不限" />
  </div>
  <div>
    <label for="maxPrice">最高總價 (萬):</label>
    <input type="number" id="maxPrice" min="0" placeholder="不限" />
  </div>
  <div><button id="applyBtn">確認篩選</button></div>
  <div><button id="resetBtn">重設篩選</button></div>
</div>

<div id="countDisplay">物件數: 0</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
  let properties = [];
  let markers = [];
  let markerClusterGroup;

  const defaultLatLng = [24.2479, 120.5457];
  const defaultZoom = 13;

  const map = L.map("map").setView(defaultLatLng, defaultZoom);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "© OpenStreetMap contributors",
  }).addTo(map);

  function parsePrice(priceStr) {
    if (!priceStr) return null;
    let num = priceStr.replace(/[^\d]/g, "");
    return num ? parseInt(num) : null;
  }

  function parseAge(ageStr) {
    const match = ageStr.match(/(\d+)/);
    return match ? parseInt(match[1]) : null;
  }

  function fillSelectOptions(id, items) {
    const select = document.getElementById(id);
    select.innerHTML = '<option value="">全部</option>'; // 先清空再加
    const uniqueItems = Array.from(new Set(items.filter((i) => i)));
    uniqueItems.forEach((item) => {
      const option = document.createElement("option");
      option.value = item;
      option.textContent = item;
      select.appendChild(option);
    });
  }

  function initFilters() {
    fillSelectOptions(
      "areaSelect",
      properties.map((p) => (p.area.match(/\S+區/) || [])[0])
    );
    fillSelectOptions(
      "typeSelect",
      properties.map((p) => p.type_status.split("/")[0].trim())
    );

    // 格局用 layout_num 排序
    const layoutItems = Array.from(
      new Set(
        properties
          .filter(p => p.layout_num !== undefined && p.layout_num !== null)
          .sort((a, b) => a.layout_num - b.layout_num)
          .map(p => p.layout_num + "房")
      )
    );
    fillSelectOptions("layoutSelect", layoutItems);
  }

  function clearMarkers() {
    if (markerClusterGroup) markerClusterGroup.clearLayers();
    markers = [];
  }

  async function edmFileExists(url) {
    try {
      const response = await fetch(url, { method: "HEAD" });
      return response.ok;
    } catch {
      return false;
    }
  }

  async function createMarker(property) {
      const marker = L.marker([property.lat, property.lng]);
      const price = parsePrice(property.price);
      const priceText = price ? price + " 萬" : "未知";
      const edmPath = property.edm_path || "";
      let popupContent = `
        <b>${property.name}</b><br/>
        區域：${property.area}<br/>
        房型：${property.type_status.split("/")[0].trim()}<br/>
        格局：${property.layout}<br/>
        價格：${priceText}<br/>
        屋齡：${property.age}<br/>
      `;
      if (edmPath) {
        popupContent += `<a href="${edmPath}" target="_blank" rel="noopener noreferrer">查看 EDM</a>`;
      }
      marker.bindPopup(popupContent);
      return marker;
    }

  async function updateMap(focusOnArea = false) {
    clearMarkers();
    const area = document.getElementById("areaSelect").value;
    const type = document.getElementById("typeSelect").value;
    const layout = document.getElementById("layoutSelect").value;
    const maxAge = parseInt(document.getElementById("ageSelect").value) || Infinity;
    const minPrice = parseInt(document.getElementById("minPrice").value) || 0;
    const maxPriceInput = document.getElementById("maxPrice").value;
    const maxPrice = maxPriceInput ? parseInt(maxPriceInput) : Infinity;

    const filtered = properties.filter((p) => {
      const price = parsePrice(p.price) || 0;
      const pAge = parseAge(p.age) || Infinity;
      const matchArea = area ? p.area.includes(area) : true;
      const pType = p.type_status.split("/")[0].trim();
      const matchType = type ? pType === type : true;

      // 用 layout_num 篩選
      const matchLayout = layout
        ? (p.layout_num !== undefined && p.layout_num + "房" === layout)
        : true;

      const matchPrice = price >= minPrice && price <= maxPrice;
      const matchAge = pAge <= maxAge;
      return matchArea && matchType && matchLayout && matchPrice && matchAge;
    });

    document.getElementById("countDisplay").textContent = `物件數: ${filtered.length}`;
    markerClusterGroup = L.markerClusterGroup({
      maxClusterRadius: 60,
      showCoverageOnHover: false,
      zoomToBoundsOnClick: true,
      spiderfyOnMaxZoom: true,
      disableClusteringAtZoom: 16,
    });

    const markerList = await Promise.all(filtered.map(p => createMarker(p)));
    markerList.forEach(marker => {
      markerClusterGroup.addLayer(marker);
      markers.push(marker);
    });
    markerClusterGroup.addTo(map);

    if (focusOnArea) {
      if (markers.length > 0) {
        map.fitBounds(L.featuredGroup(markers).getBounds(), { padding: [50, 50] });
      } else {
        map.setView(defaultLatLng, defaultZoom);
      }
    }
  }
