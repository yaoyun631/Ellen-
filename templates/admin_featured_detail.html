<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>編輯強銷物件</title>
  <style>
    body {
      font-family: "微軟正黑體", sans-serif;
      padding: 20px;
      background: #f8f8f8;
    }
    h1 {
      margin-bottom: 16px;
    }
    form {
      max-width: 600px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.05);
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 6px 8px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    .checkbox-inline {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 4px;
      border: none;
      background: #ff8a3d;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #ff7a20;
    }
    a.back-link {
      display: inline-block;
      margin-bottom: 10px;
      text-decoration: none;
      color: #666;
      font-size: 14px;
    }
    .preview {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
    }
    .preview img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <a href="{{ url_for('admin_featured') }}" class="back-link">← 返回強銷列表</a>
  <h1>編輯強銷物件：{{ featured.title }}</h1>

  <form method="POST">
    <div class="form-group">
      <label>標題</label>
      <input type="text" name="title" value="{{ featured.title or '' }}" required />
    </div>

    <div class="form-group">
      <label>副標題</label>
      <input type="text" name="subtitle" value="{{ featured.subtitle or '' }}" />
    </div>

    <div class="form-group">
      <label>區域（例如：沙鹿、梧棲…）</label>
      <input type="text" name="region" value="{{ featured.region or '' }}" />
    </div>

    <div class="form-group">
      <label>價格（單位：萬）</label>
      <input type="number" step="1" name="price" value="{{ featured.price or '' }}" />
    </div>

    <div class="form-group">
      <label>物件 ID（對應你主物件資料的編號）</label>
      <input type="text" name="property_id" value="{{ featured.property_id or '' }}" />
    </div>

    <div class="form-group">
      <label>排序（數字越小排越前面）</label>
      <input type="number" name="sort_order" value="{{ featured.sort_order or '' }}" />
    </div>

    <div class="form-group">
      <label>圖片網址（image_url）</label>
      <input type="text" name="image_url" value="{{ featured.image_url or '' }}" />
      {% if featured.image_url %}
      <div class="preview">
        目前圖片預覽：<br />
        <img src="{{ featured.image_url }}" alt="預覽圖片" />
      </div>
      {% endif %}
    </div>

    <div class="form-group">
      <label>啟用狀態</label>
      <div class="checkbox-inline">
        <input type="checkbox" id="is_active" name="is_active" {% if featured.is_active %}checked{% endif %} />
        <label for="is_active">啟用這筆強銷</label>
      </div>
    </div>

    <button type="submit">儲存變更</button>
  </form>

</body>
</html>
