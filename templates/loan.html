{% extends "base.html" %}
{% block title %}貸款試算 | Ellen帶你找家{% endblock %}
{% block content %}
<style>
  body { background-color: #fdfaf5; }

  .loan-wrapper {
    max-width: 1000px;
    margin: 0 auto;
  }

  h2 {
    color: #8a6e45;
    font-weight: 700;
    margin-bottom: 1rem;
  }

  .loan-card {
    background: #fffdf8;
    border-radius: 14px;
    padding: 16px 18px 18px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.06);
    border: 1px solid #e8dccb;
    margin-bottom: 20px;
  }

  .input-group-line {
    margin-bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    align-items: center;
  }

  .input-group-line label {
    font-size: 14px;
    color: #4c3b26;
    white-space: nowrap;
  }

  .input-group-line input,
  .input-group-line select {
    padding: 6px 8px;
    border: 1px solid #d4c4af;
    border-radius: 8px;
    font-size: 14px;
    background: #fff8f0;
  }

  .input-group-line input[type="number"],
  .input-group-line input[type="text"] {
    width: 120px;
  }

  .input-group-line input[type="checkbox"] {
    transform: scale(1.1);
    margin-right: 4px;
  }

  .loan-section-title {
    font-size: 15px;
    font-weight: 600;
    color: #7b5b31;
    margin-top: 4px;
    margin-bottom: 4px;
  }

  .loan-btn {
    background-color: #c8a97b;
    border: none;
    color: white;
    padding: 8px 18px;
    font-size: 15px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    margin-top: 8px;
  }
  .loan-btn:hover {
    background-color: #b59160;
  }

  .table-wrapper {
    overflow-x: auto;
    margin-top: 20px;
  }

  table.responsive-table {
    border-collapse: collapse;
    width: 100%;
    min-width: 720px;
    background-color: white;
    border-radius: 10px;
    overflow: hidden;
  }

  table.responsive-table th,
  table.responsive-table td {
    border: 1px solid #ece1d3;
    padding: 8px 6px;
    text-align: center;
    font-size: 13px;
  }

  table.responsive-table th {
    background-color: #c8a97b;
    color: white;
    font-weight: 600;
  }

  table.responsive-table tr:nth-child(even) td {
    background-color: #f9f4ec;
  }

  table.responsive-table tr:hover td {
    background-color: #f3e7d7;
  }

  /* 手機版：表格改成卡片樣式 */
  @media (max-width: 768px) {
    .loan-card {
      padding: 12px 10px 14px;
    }

    .input-group-line {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .input-group-line input[type="number"],
    .input-group-line input[type="text"],
    .input-group-line select {
      width: 100%;
      max-width: 260px;
    }

    table.responsive-table {
      border: 0;
      min-width: 0;
    }
    table.responsive-table thead {
      display: none;
    }
    table.responsive-table tbody {
      display: block;
    }
    table.responsive-table tr {
      display: block;
      margin-bottom: 12px;
      border: 1px solid #e0d4c3;
      border-radius: 10px;
      padding: 6px 8px;
      background: #fffdf8;
    }
    table.responsive-table td {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: none;
      border-bottom: 1px solid #f0e6d8;
      padding: 6px 4px;
      font-size: 13px;
    }
    table.responsive-table td:last-child {
      border-bottom: none;
    }
    table.responsive-table td::before {
      content: attr(data-label);
      font-weight: 600;
      color: #7b5b31;
      margin-right: 8px;
      text-align: left;
      flex: 0 0 auto;
    }
  }

  /* Modal */
  .modal {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center;
    z-index: 9999;
  }
  .modal-content {
    background: #fff; padding: 20px; border-radius: 12px;
    width: 90%; max-width: 550px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.18);
  }
  .modal-content h3 { margin-top: 0; color: #8a6e45; }
  .modal-content p { margin: 8px 0; }

  .fee-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 10px;
    margin: 10px 0;
  }
  .fee-item {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px 9px;
    background: #fffdf8;
  }
  .fee-item-title {
    font-weight: bold;
    color: #5e4b2d;
    display: flex;
    justify-content: space-between;
    margin-bottom: 3px;
    font-size: 13px;
  }
  .fee-item-note {
    font-size: 12px;
    color: #888;
    line-height: 1.4;
  }

  #feeDetailsToggle {
    margin-top: 10px;
    cursor: pointer;
    color: #8a6e45;
    font-weight: bold;
    font-size: 14px;
  }
  #feeDetailsContent {
    display: none;
  }
</style>

<div class="loan-wrapper">
  <h2>貸款月付款試算工具</h2>

  <div class="loan-card">
    <div class="loan-section-title">① 稅費相關（可不填）</div>
    <div class="input-group-line">
      <label>房屋評定現值（萬）：
        <input type="number" id="houseValue" inputmode="numeric" placeholder="可不填">
      </label>
      <label>契稅類別：
        <select id="contractTaxType">
          <option value="0.06">買賣 / 贈與 / 佔有 6%</option>
          <option value="0.04">典權 4%</option>
          <option value="0.02">交換 / 分割 2%</option>
        </select>
      </label>
    </div>
  </div>

  <div class="loan-card">
    <div class="loan-section-title">② 價格區間</div>
    <div class="input-group-line">
      <label>最低總價(萬)：
        <input type="number" id="minPrice" value="800" inputmode="numeric">
      </label>
      <label>最高總價(萬)：
        <input type="number" id="maxPrice" value="1000" inputmode="numeric">
      </label>
      <label>級距：
        <select id="step">
          <option value="5">5萬</option>
          <option value="10" selected>10萬</option>
          <option value="50">50萬</option>
        </select>
      </label>
    </div>
  </div>

  <div class="loan-card">
    <div class="loan-section-title">③ 貸款條件</div>

    <div class="input-group-line">
      <label style="white-space: nowrap;">貸款成數：</label>
      <label><input type="checkbox" class="loanRatio" value="40">4成</label>
      <label><input type="checkbox" class="loanRatio" value="45">45成</label>
      <label><input type="checkbox" class="loanRatio" value="50">5成</label>
      <label><input type="checkbox" class="loanRatio" value="55">55成</label>
      <label><input type="checkbox" class="loanRatio" value="60">6成</label>
      <label><input type="checkbox" class="loanRatio" value="65">65成</label>
      <label><input type="checkbox" class="loanRatio" value="70">7成</label>
      <label><input type="checkbox" class="loanRatio" value="75" checked>75成</label>
      <label><input type="checkbox" class="loanRatio" value="80" checked>8成</label>
    </div>

    <div class="input-group-line">
      <label>年利率（%）：
        <input type="number" step="0.01" id="rate" value="2.2" inputmode="decimal">
      </label>
    </div>

    <div class="input-group-line">
      <label>年限：</label>
      <label><input type="checkbox" class="years" value="20">20年</label>
      <label><input type="checkbox" class="years" value="30" checked>30年</label>
      <label><input type="checkbox" class="years" value="40" checked>40年</label>
    </div>

    <div class="input-group-line">
      <label><input type="checkbox" id="gracePeriod"> 寬限期月繳（只算利息）</label>
    </div>

    <button class="loan-btn" onclick="calculate()">產生試算表</button>
  </div>

  <div class="table-wrapper">
    <table id="resultTable" class="responsive-table"></table>
  </div>
</div>

<!-- 費用彈出小卡 -->
<div class="modal" id="infoModal" onclick="this.style.display='none'">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3 id="modalTitle">費用試算</h3>
    <p id="modalSelfPay" style="font-weight: bold;"></p>

    <div id="feeDetailsToggle" onclick="toggleFeeDetails()">▶ 相關費用細節（點擊展開/收合）</div>
    <div id="feeDetailsContent" class="fee-grid"></div>

    <p id="modalFeesTotal" style="font-weight: bold;"></p>
    <p id="modalCostTotal" style="font-weight: bold; color: #8a6e45;"></p>
    <p style="text-align: right;">
      <button class="loan-btn" style="margin-top:0;" onclick="document.getElementById('infoModal').style.display='none'">關閉</button>
    </p>
  </div>
</div>

<script>
function calculate() {
  const min = parseInt(document.getElementById('minPrice').value);
  const max = parseInt(document.getElementById('maxPrice').value);
  const step = parseInt(document.getElementById('step').value);

  const ratioCheckboxes = document.querySelectorAll('.loanRatio:checked');
  if (ratioCheckboxes.length === 0) {
    alert("請至少勾選一個貸款成數");
    return;
  }
  const ratios = Array.from(ratioCheckboxes).map(cb => parseFloat(cb.value) / 100);

  const rate = parseFloat(document.getElementById('rate').value) / 100;
  const years = Array.from(document.querySelectorAll('.years:checked')).map(c => parseInt(c.value));
  const showGrace = document.getElementById('gracePeriod').checked;
  const table = document.getElementById('resultTable');
  table.innerHTML = "";

  if (years.length === 0) {
    alert("請至少勾選一個年限");
    return;
  }

  // 建 header + body
  let html = "<thead><tr><th>總價</th><th>貸款金額</th>";
  years.forEach(y => { html += `<th>${y}年月付</th>`; });
  if (showGrace) {
    html += "<th>寬限期月繳</th>";
  }
  html += "</tr></thead><tbody>";

  for (let price = min; price <= max; price += step) {
    ratios.forEach(r => {
      const loanAmt = price * 10000 * r;
      const loanStr = `${Math.round(loanAmt/10000)}萬（${Math.round(r*100)}%）`;
      const loanPercent = (r * 10);
      const loanStrPercent = Number.isInteger(loanPercent) ? loanPercent.toString() : loanPercent.toFixed(1);

      let row = `<tr>
        <td><a href="#" onclick="showInfo(${price}, ${r});return false;">${price}萬</a></td>
        <td>${loanStr}</td>`;

      years.forEach(y => {
        const months = y * 12, mRate = rate / 12;
        const mPay = (loanAmt * mRate) / (1 - Math.pow(1 + mRate, -months));
        row += `<td>${Math.round(mPay).toLocaleString()}</td>`;
      });
      if (showGrace) {
        const gracePay = loanAmt * (rate / 12);
        row += `<td>${Math.round(gracePay).toLocaleString()}</td>`;
      }
      row += "</tr>";
      html += row;
    });
  }

  html += "</tbody>";
  table.innerHTML = html;

  // 手機版：加上 data-label
  applyResponsiveLabels();
}

function applyResponsiveLabels() {
  const table = document.getElementById('resultTable');
  if (!table) return;

  const headerCells = Array.from(table.querySelectorAll('thead th'));
  const rows = Array.from(table.querySelectorAll('tbody tr'));

  rows.forEach(row => {
    Array.from(row.children).forEach((cell, idx) => {
      if (headerCells[idx]) {
        cell.setAttribute('data-label', headerCells[idx].innerText.trim());
      }
    });
  });
}

function showInfo(price, ratio) {
  const houseVal = parseFloat(document.getElementById('houseValue').value || 0) * 10000;
  const taxRate = parseFloat(document.getElementById('contractTaxType').value);
  const loanAmt = price * 10000 * ratio;
  const selfPay = price * 10000 * (1 - ratio);

  const contractTax = houseVal > 0 ? houseVal * taxRate : null;
  const settingFee = loanAmt * 0.001;
  const regFee = 6000;
  const insurance = 2000;
  const openFee = 4000;
  const actualReg = 1500;
  const docFee = 1000 + 12000 + 5000;
  const warranty = price * 10000 * 0.003;
  const brokerFee = price * 10000 * 0.02;

  const fees = [];

  if (contractTax !== null) {
    fees.push({ name: `契稅 (${(taxRate*100).toFixed(0)}%)`, value: contractTax });
  } else {
    fees.push({ name: "契稅", value: "", note: "未提供評定現值" });
  }

  fees.push(
    { name: "銀行設定規費 (0.1%)", value: settingFee },
    { name: "買賣規費", value: regFee, note: "包含印花稅、謄本、買賣地政規費等（實支實付）" },
    { name: "火險+地震險", value: insurance, note: "每年保一次" },
    { name: "銀行開辦費", value: openFee, note: "(約$3000~$5000)" },
    { name: "實價登錄", value: actualReg },
    { name: "代書費", value: docFee, note: "簽約費$1000、買賣$12000、貸款設定$5000"  },
    { name: "履保費 (0.3%)", value: warranty },
    { name: "仲介服務費 (2%)", value: brokerFee },
    { name: "水、電、瓦斯、房屋稅、地價稅、管理費等", value: 0, note: "皆分算至交屋當日，由買賣雙方互相找補" }
  );

  const loanPercent = (ratio * 10);
  const loanStr = Number.isInteger(loanPercent) ? loanPercent.toString() : loanPercent.toFixed(1);
  document.getElementById("modalTitle").innerText = `總價${price}萬 貸款${loanStr}成 費用試算`;
  document.getElementById("modalSelfPay").innerText = `自備款：約 ${Math.round(selfPay).toLocaleString()} 元`;

  const list = document.getElementById("feeDetailsContent");
  list.innerHTML = "";
  fees.forEach(f => {
    const div = document.createElement("div");
    div.className = "fee-item";

    const title = document.createElement("div");
    title.className = "fee-item-title";
    const name = document.createElement("span");
    name.innerText = f.name;
    const value = document.createElement("span");
    value.innerText = f.value ? `${Math.round(f.value).toLocaleString()} 元` : "";
    title.appendChild(name);
    title.appendChild(value);
    div.appendChild(title);

    if (f.note) {
      const note = document.createElement("div");
      note.className = "fee-item-note";
      note.innerText = f.note;
      div.appendChild(note);
    }

    list.appendChild(div);
  });

  const feesTotal = fees.reduce((sum, f) => sum + (f.value || 0), 0);
  document.getElementById("modalFeesTotal").innerText =
    `費用總計：約 ${Math.round(feesTotal).toLocaleString()} 元`;

  const totalCost = selfPay + feesTotal;
  document.getElementById("modalCostTotal").innerText =
    `✅ 總負擔費用：約 ${Math.round(totalCost).toLocaleString()} 元`;

  document.getElementById("feeDetailsContent").style.display = "none";
  document.getElementById("feeDetailsToggle").innerText = "▶ 相關費用細節（點擊展開/收合）";

  document.getElementById("infoModal").style.display = "flex";
}

function toggleFeeDetails() {
  const content = document.getElementById("feeDetailsContent");
  const toggle = document.getElementById("feeDetailsToggle");
  if (content.style.display === "none") {
    content.style.display = "grid";
    toggle.innerText = "▼ 相關費用細節（點擊展開/收合）";
  } else {
    content.style.display = "none";
    toggle.innerText = "▶ 相關費用細節（點擊展開/收合）";
  }
}

/* ✅ 從網址帶入 minPrice / maxPrice，先清空再寫入，然後自動試算 */
window.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);

  const min = params.get("minPrice");
  const max = params.get("maxPrice");

  const minInput = document.getElementById("minPrice");
  const maxInput = document.getElementById("maxPrice");

  if (minInput) minInput.value = "";
  if (maxInput) maxInput.value = "";

  if (min) minInput.value = min;
  if (max) maxInput.value = max;

  if (min || max) {
    setTimeout(() => {
      calculate();
    }, 200);
  }
});
</script>
{% endblock %}
