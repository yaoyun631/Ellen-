    .container {

      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.08);
      position: relative;

    /* Logo + 標題 */
    .header-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .logo {
      width: 120px;
      display: block;
    }
    .header-title {

      font-size: 1.5rem;
      color: #000;
      flex-grow: 1;
    }
    /* carousel圖片 */
    .carousel-inner img {

      max-height: 400px;
      object-fit: contain;
      cursor: pointer;
    }
    .carousel {
      margin-bottom: 16px;
    }
    .areas-address, .small-info, .rent, .other-info, .fee-info {

      margin-bottom: 12px;

      font-size: 20px;
      color: #000;
    }
    .small-info {
      font-size: 0.9rem;
      color: #555;
    }
    .rent {
      color: #d32f2f;
      font-weight: 900;
      font-size: 32px;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .rent-small {
      font-size: 0.8rem;
      font-weight: 500;
    }

    .equipment-container {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: flex-start;
    margin-bottom: 24px;

  .equipment-item {
    width: 14%;

    border-radius: 6px;
    padding: 8px 4px;
    color: #CABAA1;
    font-weight: 700;

  .equipment-item img {

    height: 36px;
    margin-bottom: 6px;
  }

  @media (max-width: 600px) {
    .equipment-item {
      width: 20%;
      min-width: 50px;
    }
  }


    /* 按鈕區 */

      padding: 10px;
      width: 30%;
      text-decoration: none;
      color: #fff;
      border-radius: 6px;
      user-select: none;
      cursor: pointer;
      font-weight: 700;
    }
    .btn img {

      height: 28px;
      margin-bottom: 6px;
