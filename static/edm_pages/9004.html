    body {
      font-family: "微軟正黑體", sans-serif;
      background-color: #f7f3ef;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.08);
      position: relative;
    }
    /* Logo + 標題 */
    .header-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .logo {
      width: 120px;
      display: block;
    }
    .header-title {
      font-weight: 900;
      font-size: 1.5rem;
      color: #000;
      flex-grow: 1;
    }
    /* carousel圖片 */
    .carousel-inner img {
      border-radius: 8px;
      max-height: 400px;
      object-fit: contain;
      cursor: pointer;
    }
    .carousel {
      margin-bottom: 16px;
    }
    .areas-address, .small-info, .rent, .other-info, .fee-info {
      text-align: left;
      margin-bottom: 12px;
    }
    .areas-address {
      font-weight: 900;
      font-size: 20px;
      color: #000;
    }
    .small-info {
      font-size: 0.9rem;
      color: #555;
    }
    .rent {
      color: #d32f2f;
      font-weight: 900;
      font-size: 32px;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .rent-small {
      font-size: 0.8rem;
      font-weight: 500;
    }

    .equipment-container {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: flex-start;
    margin-bottom: 24px;
  }

  .equipment-item {
    width: 14%;
    min-width: 70px;
    text-align: center;
    font-size: 0.85rem;
    border-radius: 6px;
    padding: 8px 4px;
    color: #CABAA1;
    font-weight: 700;
    cursor: default;
  }

  .equipment-item img {
    width: 36px;
    height: 36px;
    margin-bottom: 6px;
  }

  @media (max-width: 600px) {
    .equipment-item {
      width: 20%;
      min-width: 50px;
    }
  }


    /* 按鈕區 */
    .btn-bottom {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 30px;
      margin-bottom: 10px;
    }
    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.9rem;
      padding: 10px;
      width: 30%;
      text-decoration: none;
      color: #fff;
      border-radius: 6px;
      user-select: none;
      cursor: pointer;
      font-weight: 700;
    }
    .btn img {
      width: 28px;
      height: 28px;
      margin-bottom: 6px;
    }
    .btn-booking {
      background-color: #a0845c;
      border: none;
    }
    .btn-booking:hover {
      background-color: #8c6b4a;
    }
    .btn-line {
      background-color: #00c300;
      border: none;
    }
    .btn-line:hover {
      background-color: #00a000;
    }
    .btn-similar {
      background-color: #38a1db;
      border: none;
    }
    .btn-similar:hover {
      background-color: #2d89c7;
    }

  </style>
